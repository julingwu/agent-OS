name: Build Android APK (Tauri 2 Mobile)

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Android Target Architecture'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - aarch64
          - all
  push:
    branches:
      - mainline
      - master
      - main
    paths:
      - 'program/desktop/**'
      - '.github/workflows/build-android.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK & NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          # 自动查找预装的最高版本 NDK
          NDK_FOUND=$(ls -1d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$NDK_FOUND" ] && [ -d "$NDK_FOUND" ]; then
            echo "Using pre-installed NDK at: $NDK_FOUND"
            echo "NDK_HOME=$NDK_FOUND" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$NDK_FOUND" >> $GITHUB_ENV
          else
            echo "Installing NDK 26.1.10909125..."
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125"
            echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
            echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          fi

          # 自动接受所有 Android SDK 协议
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'program/desktop/package-lock.json'

      - name: Install desktop dependencies
        run: |
          cd program/desktop
          npm install

      - name: Initialize Tauri Android project
        run: |
          cd program/desktop
          npx tauri android init --ci --skip-targets-install

      - name: Inject Private Root CA & Network Security Config
        run: |
          RES_DIR="program/desktop/src-tauri/gen/android/app/src/main/res"
          mkdir -p "$RES_DIR/raw"
          mkdir -p "$RES_DIR/xml"

          # 1. 复制自建根证书到 res/raw/ca.crt
          cp program/desktop/ca.crt "$RES_DIR/raw/ca.crt"

          # 2. 生成网络安全配置文件：信任内置 CA 证书与系统证书，放行 203.0.113.10 私有 HTTPS
          cat << 'EOF' > "$RES_DIR/xml/network_security_config.xml"
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="true">
                  <trust-anchors>
                      <certificates src="@raw/ca" />
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
              <domain-config cleartextTrafficPermitted="true">
                  <domain includeSubdomains="true">203.0.113.10</domain>
                  <domain includeSubdomains="true">localhost</domain>
                  <domain includeSubdomains="true">127.0.0.1</domain>
                  <trust-anchors>
                      <certificates src="@raw/ca" />
                      <certificates src="system" />
                  </trust-anchors>
              </domain-config>
          </network-security-config>
          EOF

          # 3. 将 networkSecurityConfig 配置注入 AndroidManifest.xml (安全注入，避免重复属性)
          MANIFEST="program/desktop/src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if grep -q "android:networkSecurityConfig" "$MANIFEST"; then
            echo "networkSecurityConfig already present"
          else
            sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config" /' "$MANIFEST"
          fi

          echo "✅ 根证书与网络安全策略已成功注入 Android 工程"

      - name: Build Android APK
        id: build_apk
        run: |
          cd program/desktop
          TARGET_FLAG="${{ github.event.inputs.target || 'aarch64' }}"
          if [ "$TARGET_FLAG" = "all" ]; then
            npx tauri android build --apk --debug --verbose 2>&1 | tee ../android_build.log
          else
            npx tauri android build --apk --debug --target aarch64 --verbose 2>&1 | tee ../android_build.log
          fi

      - name: Output build failure diagnosis
        if: failure()
        run: |
          echo "### ❌ Android Build Failure Details" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 120 android_build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 android_build.log

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: android_build.log

      - name: Locate and organize APK artifacts
        if: success()
        run: |
          mkdir -p output_apk
          find program/desktop/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} output_apk/ \;
          ls -la output_apk/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AgentOS-Android-APK
          path: output_apk/*.apk
          retention-days: 14
