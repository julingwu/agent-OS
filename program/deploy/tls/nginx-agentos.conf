# =============================================================================
# AgentOS 站点配置（TLS 版）—— 由 deploy/tls/gen_ca_and_cert.sh 产出的证书链驱动
#
# 部署位置：/etc/nginx/sites-available/agent-os（软链到 sites-enabled/agent-os）
# 证书来源：deploy/tls/gen_ca_and_cert.sh（本地根 CA -> SAN 含 IP 的服务器证书）
# 证书路径：/opt/agent-os/etc/{fullchain.crt,tls.key,ca.crt,tls.crt}
#   fullchain.crt = server.crt + ca.crt，必须给全链，客户端才能看到 2 级链
#
# 与旧配置的差异：
#   1. ssl_certificate 从 tls.crt 改为 fullchain.crt（2 级链）
#   2. 增加 HSTS、会话票据关闭、1.2 密码套件收紧
#   3. 显式拆出 /ui/ 与 /v1/ 两个 location（语义与原 location / 完全一致，
#      只是让路由更清楚，便于以后单独调参）；根路径仍由后端 302 到 /ui/
#   4. 其余反代头、超时、client_max_body_size 与旧配置保持一致
#
# 生效：nginx -t && systemctl reload nginx
# =============================================================================

# HTTP -> HTTPS 强制跳转
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    # ---- 证书链：fullchain.crt = 服务器证书 + 本地根 CA ----------------------
    ssl_certificate     /opt/agent-os/etc/fullchain.crt;
    ssl_certificate_key /opt/agent-os/etc/tls.key;

    # ---- 协议与套件 ---------------------------------------------------------
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_ecdh_curve            X25519:prime256v1:secp384r1;

    # ---- 会话 ---------------------------------------------------------------
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;
    ssl_session_tickets  off;

    # 自签/私有 CA 没有公共 OCSP 响应器，不启用 stapling
    ssl_stapling         off;

    # ---- 安全响应头 ---------------------------------------------------------
    # 只有 IP、没有域名，故不加 includeSubDomains
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options    "nosniff"           always;
    add_header Referrer-Policy           "no-referrer"       always;

    # ---- 上传/长连接 --------------------------------------------------------
    client_max_body_size 256m;
    proxy_read_timeout   3600s;
    proxy_send_timeout   3600s;

    # ---- 公共反代参数（location 内重复书写，nginx 不支持 location 继承 include
    #      之外的写法时保持显式，避免误改）------------------------------------

    # 根路径：后端 302 -> /ui/
    location / {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
    }

    # 管理界面静态资源（后端一并托管，保持同样的 WebSocket/SSE 兼容头）
    location /ui/ {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
    }

    # v1 API（含 /v1/health、SSE 事件流）
    location /v1/ {
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_cache off;
        # SSE 长连接
        proxy_read_timeout 3600s;
    }

    # 健康检查不打日志，避免刷屏
    location = /v1/health {
        access_log off;
        proxy_pass http://127.0.0.1:8077;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # ---- CRL 分发点（必须存在，否则 Windows/Schannel 报 CRYPT_E_NO_REVOCATION_CHECK）
    # 服务器证书里的 CDP 是 https://203.0.113.10/agentos-ca.crl
    # 注意：用 https —— 该机器的 80 端口对外不可达，http CDP 会取不到。
    location = /agentos-ca.crl {
        access_log off;
        root /opt/agent-os/etc;          # -> /opt/agent-os/etc/agentos-ca.crl
        default_type application/pkix-crl;
        add_header Cache-Control "public, max-age=3600" always;
    }
}
