# ==============================================================================
# Agent OS (oaagent-m0) - Nginx 站点配置
# ==============================================================================
# 部署建议：
#   将此文件软链接或复制到 /etc/nginx/sites-available/agent-os.conf
#   ln -s /etc/nginx/sites-available/agent-os.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# ==============================================================================

upstream agent_os_backend {
    server 127.0.0.1:8077;
    keepalive 32;
}

server {
    listen 80;
    server_name agent-os.example.com;

    # 生产环境强烈建议开启 HTTPS 并配置证书（取消下方注释并填入证书路径）
    # listen 443 ssl http2;
    # ssl_certificate /etc/letsencrypt/live/agent-os.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/agent-os.example.com/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # if ($scheme = http) { return 301 https://$host$request_uri; }

    # 客户端请求体大小上限（支持附件上传，对应 /ui/chats/{chat_id}/attachments）
    client_max_body_size 50M;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # 核心安全隔离：严禁将敏感文件与目录暴露给 Web
    # --------------------------------------------------------------------------
    # 拒绝访问隐藏文件（.env, .git 等）
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 拒绝访问后端核心目录与持久化存储
    # 注意：这里**不能**写 app / web。nginx 的正则 location 优先级高于普通前缀
    # location，把 app 写进来会让下面的 `location ^~ /app/` 全部 404（前端白屏）。
    location ~ ^/(data|workspace|docs|tools|tests)/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # 拒绝直接访问数据库与配置文件后缀
    location ~* \.(env|db|sqlite|sqlite3|shm|wal|log|py|sh|yml|yaml|md|json)$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --------------------------------------------------------------------------
    # --------------------------------------------------------------------------
    # 主工作台静态托管 (/ui/) - AI 团队协作主界面（助手对话/电脑操控/43角色/技能）
    # --------------------------------------------------------------------------
    location ^~ /ui/ {
        alias /opt/agent-os/ui_dist/;
        index index.html;
        try_files $uri $uri/ /ui/index.html;

        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }
    }

    location ^~ /ui/assets/ {
        alias /opt/agent-os/ui_dist/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --------------------------------------------------------------------------
    # 赛博指挥舱控制台静态托管 (/app/) - 总装流水线与研讨看板
    # `^~` 必须保留：否则上面的正则 location 会抢走 /app/ 的请求（实测踩过，页面 404）
    # --------------------------------------------------------------------------
    location ^~ /app/ {
        alias /opt/agent-os/web/dist/;
        index index.html;
        # SPA 路由回退：前端单页应用必须回退到 index.html
        try_files $uri $uri/ /app/index.html;

        # 禁用 HTML 页面缓存，确保更新即时生效
        location ~* \.html$ {
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }
    }

    # 前端静态资源指纹强缓存 (Vite 构建产物自带 hash)
    location ^~ /app/assets/ {
        alias /opt/agent-os/web/dist/assets/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # --------------------------------------------------------------------------
    # 实时流推送 (SSE: Server-Sent Events)
    # 路径匹配: /ui/chats/{chat_id}/stream
    # --------------------------------------------------------------------------
    location ~* ^/ui/chats/[^/]+/stream$ {
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;

        # 禁用 HTTP 代理缓冲，实时流式推送至浏览器
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 清空 Connection 头以支持 HTTP/1.1 长连接持续保活
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 维持 SSE 长时间连接（防止网关默认 60s 超时截断）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --------------------------------------------------------------------------
    # 后端动态 API 与默认反向代理
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://agent_os_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 常规请求超时时间
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
